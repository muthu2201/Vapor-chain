#
# Every commit in a pull request must carry a Developer Certificate of Origin
# sign-off (git commit -s). See CONTRIBUTING.md §12.
name: DCO
on:
  pull_request:
permissions:
  contents: read
jobs:
  sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -qE '^Signed-off-by: .+ <[^>]+>$'; then
              echo "::error::commit $c has no 'Signed-off-by: Name <email>' line"
              bad=1
            fi
          done
          if [ "$bad" != 0 ]; then
            echo "Sign off with: git commit --amend -s --no-edit (last commit) or git rebase --signoff $BASE"
            exit 1
          fi
          echo "all commits signed off"
