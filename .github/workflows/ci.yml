name: SDK CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "12.6.0" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vaporchain/sdk build && pnpm --filter @vaporchain/react build
      - run: pnpm -r run typecheck
      - name: unit tests
        run: |
          pnpm --filter @vaporchain/sdk exec vitest run --dir test/unit
          pnpm --filter @vaporchain/react exec vitest run --dir test/unit
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: "1.8.3" }
      - name: install libs
        working-directory: contracts
        run: forge install OpenZeppelin/openzeppelin-contracts eth-infinitism/account-abstraction foundry-rs/forge-std
      - name: build example contracts
        working-directory: contracts
        run: forge build
