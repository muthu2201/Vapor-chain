syntax = "proto3";
package vaporchain.apps.v1;

import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "vaporchain/apps/v1/apps.proto";

option go_package = "github.com/muthu2201/vapor-chain/chain/x/apps/types";

// Query defines the x/apps gRPC query service.
service Query {
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/vaporchain/apps/v1/params";
  }
  rpc App(QueryAppRequest) returns (QueryAppResponse) {
    option (google.api.http).get = "/vaporchain/apps/v1/apps/{app_id}";
  }
  rpc Apps(QueryAppsRequest) returns (QueryAppsResponse) {
    option (google.api.http).get = "/vaporchain/apps/v1/apps";
  }
  rpc AppByContract(QueryAppByContractRequest) returns (QueryAppByContractResponse) {
    option (google.api.http).get = "/vaporchain/apps/v1/contracts/{contract}";
  }
  rpc Contracts(QueryContractsRequest) returns (QueryContractsResponse) {
    option (google.api.http).get = "/vaporchain/apps/v1/apps/{app_id}/contracts";
  }
  rpc Quota(QueryQuotaRequest) returns (QueryQuotaResponse) {
    option (google.api.http).get = "/vaporchain/apps/v1/apps/{app_id}/quota";
  }
  rpc PendingMoves(QueryPendingMovesRequest) returns (QueryPendingMovesResponse) {
    option (google.api.http).get = "/vaporchain/apps/v1/pending_moves";
  }
  rpc PendingClaims(QueryPendingClaimsRequest) returns (QueryPendingClaimsResponse) {
    option (google.api.http).get = "/vaporchain/apps/v1/apps/{app_id}/pending_claims";
  }
  rpc CurrentEpoch(QueryCurrentEpochRequest) returns (QueryCurrentEpochResponse) {
    option (google.api.http).get = "/vaporchain/apps/v1/epoch";
  }
}

message QueryParamsRequest {}
message QueryParamsResponse { Params params = 1 [ (gogoproto.nullable) = false ]; }
message QueryAppRequest { uint64 app_id = 1; }
message QueryAppResponse { App app = 1 [ (gogoproto.nullable) = false ]; }
message QueryAppsRequest { cosmos.base.query.v1beta1.PageRequest pagination = 1; }
message QueryAppsResponse {
  repeated App apps = 1 [ (gogoproto.nullable) = false ];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}
message QueryAppByContractRequest { string contract = 1; }
message QueryAppByContractResponse {
  ContractBinding binding = 1 [ (gogoproto.nullable) = false ];
  App app = 2 [ (gogoproto.nullable) = false ];
}
message QueryContractsRequest { uint64 app_id = 1; }
message QueryContractsResponse { repeated ContractBinding bindings = 1 [ (gogoproto.nullable) = false ]; }
message QueryQuotaRequest { uint64 app_id = 1; }
message QueryQuotaResponse {
  Quota quota = 1 [ (gogoproto.nullable) = false ];
  EpochStats current_stats = 2 [ (gogoproto.nullable) = false ];
  int64 epoch_ends_at_height = 3;
}
message QueryPendingMovesRequest {}
message QueryPendingMovesResponse { repeated PendingMove moves = 1 [ (gogoproto.nullable) = false ]; }
message QueryPendingClaimsRequest { uint64 app_id = 1; }
message QueryPendingClaimsResponse { repeated PendingClaim claims = 1 [ (gogoproto.nullable) = false ]; }
message QueryCurrentEpochRequest {}
message QueryCurrentEpochResponse {
  uint64 epoch = 1;
  int64 started_at_height = 2;
  int64 ends_at_height = 3;
}
