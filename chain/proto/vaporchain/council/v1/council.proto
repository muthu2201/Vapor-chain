syntax = "proto3";
package vaporchain.council.v1;

import "gogoproto/gogo.proto";
import "cosmos_proto/cosmos.proto";
import "amino/amino.proto";

option go_package = "github.com/muthu2201/vapor-chain/chain/x/council/types";

// Params governs validator admission and the emergency guardian role.
message Params {
  option (amino.name) = "vapor/x/council/Params";
  // guardians may PAUSE Settle / IBC denoms. They cannot move funds, cannot
  // unpause and their pauses expire after guardian_pause_max_blocks.
  repeated string guardians = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // guardian_pause_max_blocks bounds a guardian-initiated pause so that a
  // compromised guardian key cannot halt payments forever.
  uint64 guardian_pause_max_blocks = 2;
  // max_power_per_validator caps a single admission grant (base units of
  // avpower) so one proposal cannot hand a single operator > 1/3 power.
  string max_power_per_validator = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
}

// Admission records an operator allowed to run a validator.
message Admission {
  string operator = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string power_granted = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  int64 admitted_height = 3;
  // removed operators can never create a validator again.
  bool removed = 4;
  string memo = 5;
}

// Pause is an emergency stop on a target. Targets:
//   "settle"           every Settle payment
//   "settle:<denom>"   Settle payments in one asset
//   "ibc"              every outbound/inbound ICS-20 transfer
//   "ibc:<denom>"      ICS-20 transfers of one base denom
message Pause {
  string target = 1;
  string set_by = 2;
  int64 set_height = 3;
  // expires_height == 0 means "until governance unpauses".
  int64 expires_height = 4;
  string reason = 5;
}

// Provenance is written once at genesis and can never be modified by any
// message. It is the on-chain authorship record of VaporChain.
message Provenance {
  string fingerprint = 1;
  string seal = 2;
  string owner = 3;
  string notice = 4;
}

// GenesisState of x/council.
message GenesisState {
  Params params = 1 [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  repeated Admission admissions = 2 [ (gogoproto.nullable) = false ];
  repeated Pause pauses = 3 [ (gogoproto.nullable) = false ];
  Provenance provenance = 4 [ (gogoproto.nullable) = false ];
}
