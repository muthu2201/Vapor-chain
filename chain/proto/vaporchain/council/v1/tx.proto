syntax = "proto3";
package vaporchain.council.v1;

import "gogoproto/gogo.proto";
import "cosmos_proto/cosmos.proto";
import "cosmos/msg/v1/msg.proto";
import "amino/amino.proto";
import "vaporchain/council/v1/council.proto";

option go_package = "github.com/muthu2201/vapor-chain/chain/x/council/types";

// Msg defines the council Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;
  // AdmitValidator allowlists an operator and mints non-transferable
  // validator power to it (authority only).
  rpc AdmitValidator(MsgAdmitValidator) returns (MsgAdmitValidatorResponse);
  // RemoveValidator jails + tombstones the operator's validator and bans the
  // operator from ever creating a validator again (authority only).
  rpc RemoveValidator(MsgRemoveValidator) returns (MsgRemoveValidatorResponse);
  // SetPause pauses (guardian or authority) or unpauses (authority) a target.
  rpc SetPause(MsgSetPause) returns (MsgSetPauseResponse);
  // UpdateParams (authority only).
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

message MsgAdmitValidator {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "vapor/council/MsgAdmitValidator";
  string authority = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string operator = 2 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string power = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  string memo = 4;
}
message MsgAdmitValidatorResponse {}

message MsgRemoveValidator {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "vapor/council/MsgRemoveValidator";
  string authority = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string operator = 2 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string reason = 3;
}
message MsgRemoveValidatorResponse {}

message MsgSetPause {
  option (cosmos.msg.v1.signer) = "signer";
  option (amino.name) = "vapor/council/MsgSetPause";
  string signer = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string target = 2;
  bool paused = 3;
  string reason = 4;
}
message MsgSetPauseResponse {}

message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "vapor/council/MsgUpdateParams";
  string authority = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  Params params = 2 [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}
message MsgUpdateParamsResponse {}
