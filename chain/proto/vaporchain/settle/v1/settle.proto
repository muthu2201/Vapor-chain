syntax = "proto3";
package vaporchain.settle.v1;

import "gogoproto/gogo.proto";
import "cosmos_proto/cosmos.proto";
import "cosmos/base/v1beta1/coin.proto";
import "amino/amino.proto";

option go_package = "github.com/muthu2201/vapor-chain/chain/x/settle/types";

// FeeAsset is one governance-allowlisted settlement asset. All amounts are in
// the asset's base units (e.g. micro-USDC for a 6-decimal USDC).
message FeeAsset {
  // denom is the bank denom (e.g. ibc/<hash> for USDC.inj). Only bank-native
  // coins are allowed so Settle never executes third-party ERC-20 code.
  string denom = 1;
  bool enabled = 2;
  // min_fee is the floor applied to payments >= micro_threshold.
  string min_fee = 3 [ (cosmos_proto.scalar) = "cosmos.Int", (gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false ];
  // max_fee caps the fee of a single payment.
  string max_fee = 4 [ (cosmos_proto.scalar) = "cosmos.Int", (gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false ];
  // micro_threshold: below it, the floor is not applied (pure percentage).
  string micro_threshold = 5 [ (cosmos_proto.scalar) = "cosmos.Int", (gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false ];
  // tab_settle_threshold: an open tab auto-settles once it reaches this.
  string tab_settle_threshold = 6 [ (cosmos_proto.scalar) = "cosmos.Int", (gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false ];
  // quota_weight: sponsorship gas earned per base unit of fee.
  string quota_weight = 7 [ (cosmos_proto.scalar) = "cosmos.Int", (gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false ];
  // credit_price: acredit minted per base unit when buying gas credits with
  // this asset. Zero disables credit purchases in this asset.
  string credit_price = 8 [ (cosmos_proto.scalar) = "cosmos.Int", (gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false ];
  // symbol and decimals are informational (SDK display).
  string symbol = 9;
  uint32 decimals = 10;
}

// Split is how every fee is divided. Must sum to 10_000 bps.
message Split {
  uint32 app_bps = 1;
  uint32 validator_bps = 2;
  uint32 relayer_bps = 3;
  uint32 treasury_bps = 4;
}

// Params of x/settle.
message Params {
  option (amino.name) = "vapor/x/settle/Params";
  uint32 fee_bps = 1;
  Split split = 2 [ (gogoproto.nullable) = false ];
  repeated FeeAsset assets = 3 [ (gogoproto.nullable) = false ];
  // treasury_admin may withdraw from the treasury pool (e.g. a multisig).
  string treasury_admin = 4;
  // relayer_admin may disburse the relayer pool, only to relayer_recipients
  // and at most relayer_payout_cap per validator_payout_interval_blocks.
  string relayer_admin = 5;
  repeated string relayer_recipients = 6;
  repeated cosmos.base.v1beta1.Coin relayer_payout_cap = 7 [ (gogoproto.nullable) = false, (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins" ];
  // sponsored_senders are EVM addresses (0x) of bundlers whose txs form the
  // sponsored lane.
  repeated string sponsored_senders = 8;
  // sponsored_lane_max_bps caps sponsored-lane gas as a share of block gas.
  uint32 sponsored_lane_max_bps = 9;
  // validator_payout_interval_blocks: how often the validator pool is paid
  // out to bonded validators weighted by power x uptime.
  int64 validator_payout_interval_blocks = 10;
  bool credits_enabled = 11;
  // max_tab_age_blocks: tabs older than this may be force-settled by anyone.
  int64 max_tab_age_blocks = 12;
}

// Tab is an escrowed micro-payment session.
message Tab {
  uint64 app_id = 1;
  string payer = 2;
  string payee = 3;
  string denom = 4;
  string amount = 5 [ (cosmos_proto.scalar) = "cosmos.Int", (gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false ];
  int64 opened_height = 6;
  uint64 entries = 7;
}

// AppAllowance lets `owner` authorize one app to pull up to `amount`.
message AppAllowance {
  string owner = 1;
  uint64 app_id = 2;
  string denom = 3;
  string amount = 4 [ (cosmos_proto.scalar) = "cosmos.Int", (gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false ];
}

// Claimable is revenue owed to an app.
message Claimable {
  uint64 app_id = 1;
  string denom = 2;
  string amount = 3 [ (cosmos_proto.scalar) = "cosmos.Int", (gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false ];
}

// PoolBalance is an internal ledger entry of a protocol pool.
message PoolBalance {
  // pool is one of "validator", "relayer", "treasury".
  string pool = 1;
  string denom = 2;
  string amount = 3 [ (cosmos_proto.scalar) = "cosmos.Int", (gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false ];
}

// Totals are lifetime counters per denom, used by invariants and analytics.
message Totals {
  string denom = 1;
  string volume = 2 [ (cosmos_proto.scalar) = "cosmos.Int", (gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false ];
  string fees = 3 [ (cosmos_proto.scalar) = "cosmos.Int", (gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false ];
  uint64 payments = 4;
}

// GenesisState of x/settle.
message GenesisState {
  Params params = 1 [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  repeated Claimable claimables = 2 [ (gogoproto.nullable) = false ];
  repeated PoolBalance pools = 3 [ (gogoproto.nullable) = false ];
  repeated Tab tabs = 4 [ (gogoproto.nullable) = false ];
  repeated AppAllowance allowances = 5 [ (gogoproto.nullable) = false ];
  repeated Totals totals = 6 [ (gogoproto.nullable) = false ];
  string credits_minted = 7 [ (cosmos_proto.scalar) = "cosmos.Int", (gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false ];
  repeated cosmos.base.v1beta1.Coin relayer_paid_this_interval = 8 [ (gogoproto.nullable) = false, (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins" ];
}
