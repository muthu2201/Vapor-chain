syntax = "proto3";
package vaporchain.settle.v1;

import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "cosmos/base/v1beta1/coin.proto";
import "vaporchain/settle/v1/settle.proto";

option go_package = "github.com/muthu2201/vapor-chain/chain/x/settle/types";

// Query defines the x/settle gRPC query service.
service Query {
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/vaporchain/settle/v1/params";
  }
  rpc QuoteFee(QueryQuoteFeeRequest) returns (QueryQuoteFeeResponse) {
    option (google.api.http).get = "/vaporchain/settle/v1/quote";
  }
  rpc Claimable(QueryClaimableRequest) returns (QueryClaimableResponse) {
    option (google.api.http).get = "/vaporchain/settle/v1/claimable/{app_id}";
  }
  rpc Pools(QueryPoolsRequest) returns (QueryPoolsResponse) {
    option (google.api.http).get = "/vaporchain/settle/v1/pools";
  }
  rpc Tab(QueryTabRequest) returns (QueryTabResponse) {
    option (google.api.http).get = "/vaporchain/settle/v1/tab";
  }
  rpc Allowance(QueryAllowanceRequest) returns (QueryAllowanceResponse) {
    option (google.api.http).get = "/vaporchain/settle/v1/allowance";
  }
  rpc Totals(QueryTotalsRequest) returns (QueryTotalsResponse) {
    option (google.api.http).get = "/vaporchain/settle/v1/totals";
  }
  rpc QuoteCredits(QueryQuoteCreditsRequest) returns (QueryQuoteCreditsResponse) {
    option (google.api.http).get = "/vaporchain/settle/v1/quote_credits";
  }
}

message QueryParamsRequest {}
message QueryParamsResponse { Params params = 1 [ (gogoproto.nullable) = false ]; }

message QueryQuoteFeeRequest {
  string denom = 1;
  string amount = 2;
}
message QueryQuoteFeeResponse {
  string fee = 1;
  string net = 2;
}

message QueryClaimableRequest { uint64 app_id = 1; }
message QueryClaimableResponse {
  repeated cosmos.base.v1beta1.Coin claimable = 1 [ (gogoproto.nullable) = false, (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins" ];
}

message QueryPoolsRequest {}
message QueryPoolsResponse { repeated PoolBalance pools = 1 [ (gogoproto.nullable) = false ]; }

message QueryTabRequest {
  uint64 app_id = 1;
  string payer = 2;
  string payee = 3;
  string denom = 4;
}
message QueryTabResponse {
  Tab tab = 1 [ (gogoproto.nullable) = false ];
  bool found = 2;
}

message QueryAllowanceRequest {
  string owner = 1;
  uint64 app_id = 2;
  string denom = 3;
}
message QueryAllowanceResponse { string amount = 1; }

message QueryTotalsRequest {}
message QueryTotalsResponse {
  repeated Totals totals = 1 [ (gogoproto.nullable) = false ];
  string credits_minted = 2;
}

message QueryQuoteCreditsRequest {
  string denom = 1;
  string amount = 2;
}
message QueryQuoteCreditsResponse { string credits = 1; }
