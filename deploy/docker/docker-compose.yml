#
# Off-chain stack for a VaporChain node you already run (validator or RPC).
# It does NOT run consensus — point VAPOR_EVM_RPC / _REST / _COMET at your node.
# Secrets are files, mounted read-only; never bake keys into images.
#
#   cp .env.example .env   # fill in endpoints + paths
#   docker compose --env-file .env up -d
name: vaporchain

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    image: postgres:18-bookworm
    <<: *restart
    environment:
      POSTGRES_USER: vapor
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
      POSTGRES_DB: vapor
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    secrets: [pg_password]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vapor"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [vapor]

  sponsor:
    image: vaporchain/sponsor:${VAPOR_TAG:-latest}
    <<: *restart
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      VAPOR_EVM_RPC: ${VAPOR_EVM_RPC}
      VAPOR_REST: ${VAPOR_REST}
      VAPOR_PAYMASTER: ${VAPOR_PAYMASTER}
      VAPOR_DATABASE_URL: postgres://vapor@postgres:5432/vapor_sponsor
      VAPOR_SIGNER_KEY_FILE: /run/secrets/sponsor_signer
      VAPOR_TRUSTED_PROXIES: ${VAPOR_TRUSTED_PROXIES:-}
      VAPOR_CORS_ORIGINS: ${VAPOR_CORS_ORIGINS:-}
      PGPASSWORD_FILE: /run/secrets/pg_password
    secrets: [sponsor_signer, pg_password]
    ports: ["8800:8800"]
    networks: [vapor]

  bundler:
    image: vaporchain/bundler:${VAPOR_TAG:-latest}
    <<: *restart
    environment:
      RPC_URL: ${VAPOR_EVM_RPC}
      EXECUTOR_KEYS_FILE: /run/secrets/executor_keys
      UTILITY_KEY_FILE: /run/secrets/utility_key
    secrets: [executor_keys, utility_key]
    ports: ["4337:4337"]
    networks: [vapor]

  indexer:
    image: vaporchain/indexer:${VAPOR_TAG:-latest}
    <<: *restart
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      VAPOR_EVM_RPC: ${VAPOR_EVM_RPC}
      VAPOR_COMET_RPC: ${VAPOR_COMET}
      VAPOR_PAYMASTER: ${VAPOR_PAYMASTER}
      VAPOR_DATABASE_URL: postgres://vapor@postgres:5432/vapor_indexer
      VAPOR_ARCHIVE_DIR: /archive
      VAPOR_ARCHIVE_EVERY: ${VAPOR_ARCHIVE_EVERY:-10000}
    volumes:
      - archive:/archive
    ports: ["8900:8900"]
    networks: [vapor]

  web:
    image: vaporchain/web:${VAPOR_TAG:-latest}
    <<: *restart
    environment:
      PORT: 3000
    ports: ["3000:3000"]
    networks: [vapor]
    profiles: ["web"]

volumes:
  pgdata:
  archive:

networks:
  vapor:

secrets:
  pg_password:
    file: ${PG_PASSWORD_FILE:-./secrets/pg_password}
  sponsor_signer:
    file: ${SPONSOR_SIGNER_FILE:-./secrets/sponsor_signer}
  executor_keys:
    file: ${EXECUTOR_KEYS_FILE:-./secrets/executor_keys}
  utility_key:
    file: ${UTILITY_KEY_FILE:-./secrets/utility_key}
